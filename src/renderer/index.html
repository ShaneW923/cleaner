<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
  <title>Cleaner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="titlebar">
    <span class="app-title">Cleaner</span>
    <nav>
      <button id="scanBtn" class="link" hidden>重新扫描</button>
      <button id="cancelBtn" class="link" hidden>停止</button>
    </nav>
  </header>

  <main>
    <aside class="panel">
      <section class="hero">
        <div class="big"><span id="bigFrom" class="from"></span><span id="bigNum"></span><span id="bigUnit" class="unit"></span></div>
        <div id="bigCaption" class="caption">扫描缓存，看看哪些能放心清理</div>
        <div id="disk" class="disk" hidden>
          <div class="diskbar">
            <span id="segUsed" class="seg used"></span><span id="segCache" class="seg cache"></span><span id="segSel" class="seg sel"></span><span id="segFree" class="seg free"></span>
          </div>
          <div id="diskTotal" class="disk-total"></div>
        </div>
        <p id="summary" class="summary"></p>
        <div id="progressLine" class="progress" hidden><div id="progressBar"></div></div>
      </section>

      <div id="groups" class="groups"></div>

      <footer class="panel-foot">
        <span id="selectedInfo" class="muted">未选择</span>
        <button id="cleanBtn" class="primary" disabled>清理</button>
      </footer>
    </aside>

    <section class="garden" id="garden">
      <svg id="map" role="img" aria-label="缓存占用图"></svg>
      <div id="emptyGarden" class="empty-garden">
        <svg viewBox="0 0 240 240" class="rake" aria-hidden="true">
          <circle cx="120" cy="120" r="112" /><circle cx="120" cy="120" r="96" />
          <circle cx="120" cy="120" r="80" />
        </svg>
        <button id="bigScanBtn" class="big-scan">开始扫描</button>
        <p>扫描缓存、日志和开发工具缓存，扫描不会删除任何东西</p>
      </div>
    </section>
  </main>

  <div id="tooltip" class="tooltip" hidden></div>

  <dialog id="confirm">
    <h2 id="confirmTitle"></h2>
    <ul id="confirmList" class="confirm-list"></ul>
    <p id="confirmNote" class="confirm-note" hidden></p>
    <div class="dialog-actions">
      <button id="confirmNo" class="ghost">取消</button>
      <button id="confirmYes" class="primary">清理</button>
    </div>
  </dialog>

  <script src="stones.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
